<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 및 서명 등록 폼</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 10px; background-color: #f9f9f9; word-break: keep-all; }
        .container { max-width: 650px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: auto; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #222; }
        
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; background: #fff; }
        
        .date-container { display: flex; align-items: center; gap: 8px; }
        .date-container input[type="date"] { flex: 1; }
        .checkbox-label { font-weight: normal; display: flex; align-items: center; gap: 5px; width: auto; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .checkbox-label input { width: 18px; height: 18px; }
        
        .canvas-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            margin-top: 10px; 
        }
        .sign-box { 
            border: 1px solid #ddd; 
            padding: 12px; 
            text-align: center; 
            background: #fafafa; 
            border-radius: 6px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sign-box span {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
            text-align: left;
            width: 100%;
        }
        /* 서명 칸 정사각형 비율(1:1) 고정 */
        canvas { 
            border: 1px solid #ccc; 
            background: #fff; 
            width: 100%; 
            max-width: 200px; 
            aspect-ratio: 1 / 1; 
            touch-action: none; 
            border-radius: 4px;
        }
        .sign-box button {
            margin-top: 10px !important;
            padding: 8px !important;
            font-size: 14px !important;
            background: #777 !important;
            width: 100% !important;
            max-width: 200px;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .sign-box button:hover { background: #555 !important; }
        
        .notice-box { background-color: #fff8e1; border: 1px solid #ffe0b2; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
        .notice-box h3 { margin-top: 0; color: #e65100; font-size: 15px; margin-bottom: 8px; }
        .notice-box ul { margin: 0; padding-left: 18px; font-size: 13px; color: #333; line-height: 1.5; }
        .notice-box .warning { color: #d32f2f; font-weight: bold; margin-top: 8px; display: block; font-size: 13px; }

        #submitBtn { background: #4CAF50; color: white; padding: 14px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 17px; font-weight: bold; margin-top: 10px; }
        #submitBtn:hover { background: #45a049; }

        .note { font-size: 12px; color: #e65100; margin-top: 4px; }

        @media (min-width: 768px) {
            body { margin: 20px; }
            .container { padding: 25px; }
            h2 { font-size: 24px; }
            .canvas-container { 
                flex-direction: row; 
                justify-content: space-between; 
            }
            .sign-box { flex: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>사내 정보 및 서명 등록</h2>
    <form id="infoForm" onsubmit="handleSubmit(event)">
        
        <div class="form-group">
            <label>소속</label>
            <select name="department" required>
                <option value="품질보증부">1. 품질보증부</option>
                <option value="품질보증부 QC팀 QC파트" selected>2. 품질보증부 QC팀 QC파트</option>
            </select>
        </div>

        <div class="form-group">
            <label>입사일자</label>
            <div class="date-container">
                <input type="date" name="hireDate" id="hireDateInput" required>
                <label class="checkbox-label"><input type="checkbox" id="hireDateUnknown" onchange="toggleDate('hireDateInput', this)"> 모름</label>
            </div>
        </div>

        <div class="form-group">
            <label>발령일자</label>
            <div class="date-container">
                <input type="date" name="appointDate" id="appointDateInput" required>
                <label class="checkbox-label"><input type="checkbox" id="appointDateUnknown" onchange="toggleDate('appointDateInput', this)"> 모름</label>
            </div>
        </div>

        <div class="form-group">
            <label>이름 (한글)</label>
            <input type="text" name="nameKo" placeholder="홍길동" required>
        </div>

        <div class="form-group">
            <label>이름 (영문)</label>
            <input type="text" name="nameEn" placeholder="HONG GILDONG" required>
        </div>

        <div class="form-group">
            <label>휴대폰 번호 (- 없이 숫자만 입력)</label>
            <input type="tel" name="phone" id="phoneInput" placeholder="01012345678" oninput="formatPhone(this)" required>
            <div class="note">* 자동으로 000-0000-0000 형식으로 변환됩니다.</div>
        </div>

        <div class="form-group">
            <label>접속명 1</label>
            <input type="text" name="connName1" placeholder="EX: GDHONG (홍길동의 경우)">
        </div>

        <div class="form-group">
            <label>접속명 2</label>
            <input type="text" name="connName2" placeholder="EX: GDH (홍길동의 경우)">
        </div>

        <div class="form-group">
            <label>증명사진 업로드 (자동 500KB 이하 최적화)</label>
            <input type="file" id="photoFile" accept="image/*" required>
        </div>

        <div class="form-group">
            <label>서명 등록 (3개 모두 등록 필수 - 정사각형)</label>
            <div class="note">⚠️ 1, 2, 3번 서명 모두 직접 그려서 등록해 주세요. (제출 시 1번 서명이 기본 선택됩니다)</div>
            <div class="canvas-container">
                <div class="sign-box">
                    <span>서명 1 (선택됨)</span>
                    <canvas id="canvas1"></canvas>
                    <button type="button" onclick="clearCanvas(1)">지우기</button>
                </div>
                <div class="sign-box">
                    <span>서명 2</span>
                    <canvas id="canvas2"></canvas>
                    <button type="button" onclick="clearCanvas(2)">지우기</button>
                </div>
                <div class="sign-box">
                    <span>서명 3</span>
                    <canvas id="canvas3"></canvas>
                    <button type="button" onclick="clearCanvas(3)">지우기</button>
                </div>
            </div>
            <input type="hidden" name="selectedSign" value="1">
        </div>

        <div class="form-group">
            <label>안전화 사이즈</label>
            <input type="text" name="safetyShoe" placeholder="EX: 270" required>
        </div>
        <div class="form-group">
            <label>근무복 사이즈(상의 S/M/L/XL/XXL, 하의 inch 숫자 작성)</label>
            <input type="text" name="uniformSize" placeholder="EX: XL 30" required>
        </div>

        <div class="notice-box">
            <h3>📌 안내 사항</h3>
            <ul>
                <li>안전화 및 근무복 지급 시기: ASAP</li>
                <li>WIVI 아이디 생성 시기: 입사 약 일주일 후</li>
                <li>인트라넷 및 ERP 아이디 생성 시기: 입사 한달 후</li>
            </ul>
            <span class="warning">※ 잘못 제출한 경우 한 시간 내 다시 제출해 주세요. (가장 최근 내용으로 처리)</span>
        </div>

        <button type="submit" id="submitBtn">제출하기</button>
    </form>
</div>

<script>
    function toggleDate(inputId, checkbox) {
        const input = document.getElementById(inputId);
        if (checkbox.checked) {
            input.value = "";
            input.disabled = true;
        } else {
            input.disabled = false;
        }
    }

    function formatPhone(input) {
        let val = input.value.replace(/[^0-9]/g, '');
        if (val.length > 11) {
            val = val.slice(0, 11);
        }
        if (val.length > 3 && val.length <= 7) {
            val = val.slice(0, 3) + '-' + val.slice(3);
        } else if (val.length > 7) {
            val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
        }
        input.value = val;
    }

    const canvases = [1, 2, 3].map(id => {
        const canvas = document.getElementById('canvas' + id);
        const ctx = canvas.getContext('2d');
        let painting = false;

        function resizeCanvas() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0);

            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            
            const size = rect.width;
            canvas.width = size;
            canvas.height = size;

            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, size, size);
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function startPosition(e) { painting = true; draw(e); }
        function finishedPosition() { painting = false; ctx.beginPath(); }
        
        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'black';

            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);
        
        canvas.addEventListener('touchstart', function(e) { e.preventDefault(); startPosition(e); });
        canvas.addEventListener('touchend', function(e) { e.preventDefault(); finishedPosition(); });
        canvas.addEventListener('touchmove', function(e) { e.preventDefault(); draw(e); });

        return canvas;
    });

    function clearCanvas(id) {
        const canvas = document.getElementById('canvas' + id);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('load', () => {
        [1, 2, 3].forEach(id => {
            const canvas = document.getElementById('canvas' + id);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
    });

    // 증명사진을 500KB 이하로 자동 압축하는 함수
    function compressImage(file, maxSizeKB = 500) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDimension = 1000; // 해상도 제한 상향 (500KB 최적화 대응)
                    if (width > height && width > maxDimension) {
                        height = Math.round((height * maxDimension) / width);
                        width = maxDimension;
                    } else if (height > maxDimension) {
                        width = Math.round((width * maxDimension) / height);
                        height = maxDimension;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "white";
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);

                    let quality = 0.9;
                    let dataUrl = canvas.toDataURL('image/jpeg', quality);

                    while ((dataUrl.length * (3/4)) / 1024 > maxSizeKB && quality > 0.1) {
                        quality -= 0.1;
                        dataUrl = canvas.toDataURL('image/jpeg', quality);
                    }

                    resolve(dataUrl);
                };
                img.onerror = error => reject(error);
            };
            reader.onerror = error => reject(error);
        });
    }

    function getCanvasJpegData(canvasId) {
        const canvas = document.getElementById(canvasId);
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        
        tempCtx.fillStyle = "white";
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(canvas, 0, 0);
        
        return tempCanvas.toDataURL('image/jpeg', 0.9);
    }

    async function handleSubmit(event) {
        event.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "제출 중입니다...";
        btn.disabled = true;

        const form = event.target;
        
        const photoInput = document.getElementById('photoFile');
        let photoBase64 = "";
        if (photoInput.files.length > 0) {
            photoBase64 = await compressImage(photoInput.files[0], 500);
        }

        const sign1 = getCanvasJpegData('canvas1');
        const sign2 = getCanvasJpegData('canvas2');
        const sign3 = getCanvasJpegData('canvas3');

        const formData = {
            department: form.department.value,
            hireDate: document.getElementById('hireDateUnknown').checked ? "모름" : form.hireDate.value,
            appointDate: document.getElementById('appointDateUnknown').checked ? "모름" : form.appointDate.value,
            nameKo: form.nameKo.value,
            nameEn: form.nameEn.value,
            phone: form.phone.value,
            connName1: form.connName1.value,
            connName2: form.connName2.value,
            photo: photoBase64,
            sign1: sign1,
            sign2: sign2,
            sign3: sign3,
            selectedSign: form.selectedSign.value,
            safetyShoe: form.safetyShoe.value,
            uniformSize: form.uniformSize.value
        };

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx437pPN2lftPMyXofg4JI3vdcL29y0q-kgR65qtoxZ9JfLnOHxUe7Sl5xnfny7A_Fn/exec";

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(formData)
            });

            alert("성공적으로 제출되었습니다!");
            form.reset();
            [1, 2, 3].forEach(id => clearCanvas(id));
        } catch (error) {
            alert("제출 중 오류가 발생했습니다: " + error);
        } finally {
            btn.innerText = "제출하기";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
